<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050" style="background:#FFFFFF; font-family:'Inter', sans-serif;">
  <rect width="800" height="1050" fill="#FFFFFF"/>
  <rect x="40" y="40" width="720" height="970" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Header Banner -->
  <text x="80" y="90" font-size="12" fill="#6B7280" font-weight="600" letter-spacing="1">COMPANIES ACT 2006 — STATUTORY SHAREHOLDER FILING</text>
  <text x="720" y="90" font-size="12" fill="#6B7280" text-anchor="end">FORM PSC01 / REF: 2026-UK-7891</text>
  <line x1="80" y1="102" x2="720" y2="102" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Document Title -->
  <text x="80" y="140" font-size="18" fill="#111827" font-weight="700">Section 3: Declaration of Persons with Significant Control (PSC)</text>
  <text x="80" y="162" font-size="13" fill="#4B5563">Submitted on behalf of Nordhaven Trading Ltd (Registration: UK-12345678)</text>
  
  <!-- Field 1: Director Name -->
  <g id="region-field-1">
    <rect x="140" y="210" width="480" height="70" rx="2" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="156" y="235" font-size="11" fill="#6B7280" font-weight="600">3.1 DECLARING OFFICER / MANAGING DIRECTOR</text>
    <text x="156" y="260" font-size="16" fill="#111827" font-weight="600" font-family="'IBM Plex Mono', monospace">Erik Nordhaven</text>
  </g>

  <!-- Field 2: Ownership Percentage -->
  <g id="region-field-2">
    <rect x="140" y="310" width="480" height="80" rx="2" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="156" y="335" font-size="11" fill="#6B7280" font-weight="600">3.2 QUALIFYING HOLDING IN CONTROLLED SUBSIDIARY</text>
    <text x="156" y="362" font-size="15" fill="#111827" font-weight="600" font-family="'IBM Plex Mono', monospace">Nordhaven Trading Ltd maintains a forty percent (40%) qualifying ownership share</text>
  </g>

  <!-- Field 3: Target Entity -->
  <g id="region-field-3">
    <rect x="140" y="420" width="480" height="70" rx="2" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="156" y="445" font-size="11" fill="#6B7280" font-weight="600">3.3 NOMINATED SUBSIDIARY ENTITY NAME</text>
    <text x="156" y="470" font-size="16" fill="#111827" font-weight="600" font-family="'IBM Plex Mono', monospace">Greenfield Subsidiary Ltd</text>
  </g>

  <!-- Legal Boilerplate -->
  <text x="80" y="540" font-size="12" fill="#4B5563" font-weight="600">Attestation &amp; Verification Clause:</text>
  <text x="80" y="565" font-size="11" fill="#6B7280">I confirm that the particulars specified above are verified against company registry records and reflect true</text>
  <text x="80" y="585" font-size="11" fill="#6B7280">beneficial ownership allocations as of the statutory reporting date 15 January 2026.</text>

  <!-- Signature line -->
  <line x1="80" y1="670" x2="360" y2="670" stroke="#9CA3AF" stroke-width="1"/>
  <text x="80" y="690" font-size="11" fill="#6B7280">Authorised Signatory: E. Nordhaven</text>
  <text x="80" y="708" font-size="10" fill="#9CA3AF">Execution Date: 17 January 2026</text>

  <rect x="520" y="640" width="160" height="80" fill="none" stroke="#D1D5DB" stroke-dasharray="4,4"/>
  <text x="600" y="685" font-size="11" fill="#9CA3AF" text-anchor="middle">[ Official Notary Seal ]</text>

  <!-- Footer -->
  <line x1="80" y1="960" x2="720" y2="960" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="985" font-size="11" fill="#9CA3AF">COMPANIES HOUSE FORM PSC01 • CONFIDENTIAL COMPLIANCE RECORD</text>
  <text x="720" y="985" font-size="11" fill="#9CA3AF" text-anchor="end">Page 3 of 8</text>
</svg>
