[project]
name = "veritrace-api"
version = "0.1.0"
description = "VeriTraceAI FastAPI Backend & State Machine Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
